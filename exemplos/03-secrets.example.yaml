# EXEMPLO: não coloque valores reais neste arquivo (o repositório é público).
# Uso LOCAL (kind/Docker Desktop): copie para k8s/03-secrets.yaml (ignorado pelo Git),
# preencha e aplique.
# Uso no AKS: NÃO use este arquivo. O Secret platform-secrets é gerado pelo driver CSI
# a partir do Azure Key Vault (ver k8s/03-keyvault-secrets.yaml).
# Fica FORA de k8s/ de propósito: um "kubectl apply -f k8s/" não pode aplicar
# placeholders por cima do Secret real.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: fcg
type: Opaque
stringData:
  POSTGRES_USER: "<usuario-postgres>"
  POSTGRES_PASSWORD: "<senha-postgres>"
  Jwt__Secret: "<minimo-32-caracteres-aleatorios>"
  ConnectionStrings__Postgres: "Host=postgres-service;Database=fcg;Username=<usuario-postgres>;Password=<senha-postgres>"
  RABBITMQ_PASSWORD: "<senha-rabbitmq>"
  Mongo__ConnectionString: "mongodb://mongo-service:27017"
  SeedAdmin__Senha: "<senha-admin-inicial>"
  KONG_POSTGRES_USER: "<usuario-kong>"
  KONG_POSTGRES_PASSWORD: "<senha-kong>"
  KONG_POSTGRES_DB: "<nome-banco-kong>"
  GRAFANA_ADMIN_PASSWORD: "<senha-grafana>"