apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fcg
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'users-api'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['users-api-service:80']

      - job_name: 'catalog-api'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['catalog-api-service:80']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fcg
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090