# Segredos vindos do Azure Key Vault (kv-fcg-tc4) via CSI Secret Store + Workload Identity.
# Substitui o antigo 03-secrets.yaml: o Secret "platform-secrets" é CRIADO pelo driver
# a partir do cofre (mesmas 11 chaves), então os secretKeyRef dos Deployments não mudam.
# Nenhum valor sensível aqui: clientID/tenantId são identificadores, não credenciais.
#
# Pré-requisitos (Azure, fora do cluster):
#   - UAMI id-fcg-kv com papel "Key Vault Secrets User" no kv-fcg-tc4
#   - Federated credential: system:serviceaccount:fcg:fcg-sa (issuer OIDC do aks-fcg-tc4)
# O Secret só existe enquanto ao menos um pod montar o volume CSI (as 4 APIs montam).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fcg-sa
  namespace: fcg
  annotations:
    azure.workload.identity/client-id: "e6ab1099-aa55-4f9e-9cab-0ad3c1038720"   # UAMI id-fcg-kv
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fcg-keyvault
  namespace: fcg
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "e6ab1099-aa55-4f9e-9cab-0ad3c1038720"   # Workload Identity (UAMI id-fcg-kv)
    keyvaultName: "kv-fcg-tc4"
    tenantId: "11dbbfe2-89b8-4549-be10-cec364e59551"
    objects: |
      array:
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: postgres-conn
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: mongo-conn
          objectType: secret
        - |
          objectName: seed-admin-senha
          objectType: secret
        - |
          objectName: kong-postgres-user
          objectType: secret
        - |
          objectName: kong-postgres-password
          objectType: secret
        - |
          objectName: kong-postgres-db
          objectType: secret
        - |
          objectName: grafana-admin-password
          objectType: secret
  # Espelha os arquivos montados num Secret k8s com as chaves que os manifests já usam
  secretObjects:
    - secretName: platform-secrets
      type: Opaque
      data:
        - { objectName: postgres-user,          key: POSTGRES_USER }
        - { objectName: postgres-password,      key: POSTGRES_PASSWORD }
        - { objectName: postgres-conn,          key: ConnectionStrings__Postgres }
        - { objectName: jwt-secret,             key: Jwt__Secret }
        - { objectName: rabbitmq-password,      key: RABBITMQ_PASSWORD }
        - { objectName: mongo-conn,             key: Mongo__ConnectionString }
        - { objectName: seed-admin-senha,       key: SeedAdmin__Senha }
        - { objectName: kong-postgres-user,     key: KONG_POSTGRES_USER }
        - { objectName: kong-postgres-password, key: KONG_POSTGRES_PASSWORD }
        - { objectName: kong-postgres-db,       key: KONG_POSTGRES_DB }
        - { objectName: grafana-admin-password, key: GRAFANA_ADMIN_PASSWORD }
