apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-api-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMQ__Host: "rabbitmq-service"
  RabbitMQ__VirtualHost: "/"
  RabbitMQ__Username: "guest"
  Mongo__Database: "fcg_notifications"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      serviceAccountName: fcg-sa   # Workload Identity -> Key Vault
      containers:
        - name: notifications-api
          image: acrfcgtc4.azurecr.io/fcg-notifications-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: notifications-api-config
          env:
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_PASSWORD
            - name: Mongo__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: Mongo__ConnectionString
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      # Volume CSI do Key Vault: mantém o Secret platform-secrets sincronizado (ver 03-keyvault-secrets.yaml)
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fcg-keyvault
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-api-service
  namespace: fcg
spec:
  selector:
    app: notifications-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
