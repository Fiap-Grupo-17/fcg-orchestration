apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "fcg-users-api"
  Jwt__Audience: "fcg-platform"
  Jwt__ExpiresInMinutes: "60"
  RabbitMQ__Host: "rabbitmq-service"
  RabbitMQ__VirtualHost: "/"
  RabbitMQ__Username: "guest"
  SeedAdmin__Email: "admin@fcg.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      containers:
        - name: users-api
          image: fcg-users-api:latest
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: users-api-config
          env:
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: Jwt__Secret
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: ConnectionStrings__Postgres
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_PASSWORD
            - name: SeedAdmin__Senha
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: SeedAdmin__Senha
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: users-api-service
  namespace: fcg
spec:
  selector:
    app: users-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: users-api-nodeport
  namespace: fcg
spec:
  selector:
    app: users-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
  type: NodePort
